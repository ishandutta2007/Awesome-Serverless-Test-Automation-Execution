<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg-grid { stroke: rgba(255,255,255,0.04); stroke-width: 1; }
      .particle { fill: #38bdf8; opacity: 0.3; }
      @keyframes float1 { 0% { transform: translateY(0px) scale(1); opacity: 0.2; } 50% { transform: translateY(-18px) scale(1.15); opacity: 0.55; } 100% { transform: translateY(0px) scale(1); opacity: 0.2; } }
      @keyframes float2 { 0% { transform: translateY(0px) scale(1); opacity: 0.3; } 50% { transform: translateY(16px) scale(1.1); opacity: 0.6; } 100% { transform: translateY(0px) scale(1); opacity: 0.3; } }
      @keyframes pulseGlow { 0% { opacity: 0.25; } 50% { opacity: 0.5; } 100% { opacity: 0.25; } }
      @keyframes dashMove { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
      .flow-path { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
      .floating-node-1 { animation: float1 7s ease-in-out infinite; }
      .floating-node-2 { animation: float2 6s ease-in-out infinite; }
      .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- Background Grid Lines -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Glowing Background Elements (Deep Behind Foreground) -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" class="pulse-circle" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="160" fill="url(#glowGrad)" class="pulse-circle" filter="url(#glow)"/>

  <!-- Dynamic Animated Flow Streams in Background -->
  <g opacity="0.35">
    <path d="M 80,80 Q 300,40 500,70 T 900,50 T 1120,90" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-path"/>
    <path d="M 80,300 Q 350,330 650,290 T 1120,310" fill="none" stroke="#a855f7" stroke-width="2" class="flow-path" style="animation-duration: 4s;"/>
  </g>

  <!-- Subtle Floating Architecture Micro-Nodes (Decorative Background Accents) -->
  <g class="floating-node-1">
    <rect x="80" y="100" width="65" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="112" y="122" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">λ Lambda</text>
  </g>

  <g class="floating-node-2">
    <rect x="1040" y="80" width="75" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="1077" y="102" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">⚡ Vitest</text>
  </g>

  <g class="floating-node-1">
    <rect x="1020" y="250" width="85" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="1062" y="272" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">📦 LocalStack</text>
  </g>

  <g class="floating-node-2">
    <rect x="90" y="240" width="75" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="127" y="262" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">🔄 Step Fn</text>
  </g>

  <!-- Top Pill / Badge -->
  <g>
    <rect x="440" y="38" width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="458" cy="53" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="605" y="58" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.2">CURATED AUTOMATION ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle (Crisp, High Contrast, Guaranteed Foreground) -->
  <text x="600" y="145" text-anchor="middle" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
    Serverless Test Automation Execution
  </text>

  <text x="600" y="195" text-anchor="middle" font-size="18" font-weight="400" fill="#f1f5f9" letter-spacing="0.2">
    Top SaaS Platforms, Open-Source Runtimes, and Emulation Toolkits
  </text>

  <text x="600" y="230" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
    Testing Serverless Functions • Edge Runtimes • Cloud Microservices • Event-Driven Architectures
  </text>

  <!-- Feature Highlights / Pills Row -->
  <g transform="translate(300, 265)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">⚡ Edge Runtimes</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="215" y="18" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle">☁️ Cloud Emulation</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="367" y="18" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">🔍 Observability &amp; APM</text>

    <!-- Pill 4 -->
    <rect x="455" y="0" width="145" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="527" y="18" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">🚀 CI/CD Test Runners</text>
  </g>

  <!-- Subtle Bottom Border Glow Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" rx="2"/>
</svg>
